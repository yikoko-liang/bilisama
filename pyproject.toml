[project]
name = "bilisama"
version = "0.1.0"
description = "BiliSama —— B 站直播 AI 伴播"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    # 传输：自己收发帧，不用 openai SDK 的客户端（见计划 §3.1）
    "websockets>=13.0",
    # 只用它的 types.realtime 给正式版方言做收发校验
    "openai>=2.28",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "aiohttp>=3.13",
    "brotli>=1.1",
    "pure-protobuf~=3.1.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=1.26",
    "pysbd>=0.3.4",
]

[project.optional-dependencies]
# 本地 TTS 兜底。云端 Qwen3-TTS 走 HTTP/WS，不需要这个。
mlx = ["mlx-audio>=0.2.0"]

[project.scripts]
bilisama = "bilisama.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bilisama"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 注释和 docstring 一律英文。用户可见的文案（CLI 输出、设置界面标签、
# 人设文本）保持中文 —— 主播是中文用户。
ignore = [
    # Comments and docstrings are English. These three fire on the Chinese text we
    # show to the streamer — CLI output, settings labels, persona copy — where
    # full-width punctuation is correct.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
# Without this, bilisama only resolves when "src" is on the command line. Any
# narrower run — an editor checking one file, `mypy tests` — falls back to the
# editable install in .venv, which carries no py.typed and is therefore skipped
# as untyped — mypy/modulefinder.py:101, "module is installed, but missing
# library stubs or py.typed marker". That run writes its wrong view into
# .mypy_cache, and the next full run inherits it and reports attr-defined errors
# on imports that are fine. Same tree, opposite verdicts, decided by who ran
# mypy last. Reproduced: `mypy tests && mypy src && mypy src tests tools` on one
# cache dir used to exit 1 on four imports across three files.
mypy_path = "src"
# So a bare `mypy` checks exactly what scripts/gate.sh checks. One definition of
# "the whole tree", not two.
files = ["src", "tests", "tools"]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
# 第三方库没有类型标注的，单独放行
[[tool.mypy.overrides]]
module = ["pysbd.*", "brotli.*", "mlx_audio.*"]
ignore_missing_imports = true

# speech-to-speech 装在它自己的 venv 里，这边解析不到是预期的。
# shim 的正确性由 tests/integration/test_s2s_patches.py 在那个 venv 里验证。
[[tool.mypy.overrides]]
module = ["speech_to_speech.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: 需要真实的 speech-to-speech 服务，默认不跑",
    "provider_a: 需要真实的托管 Realtime 端点，默认不跑",
    "manual: 一次性探针，手动跑",
]
# Keeps the inner loop down to the tier that needs nothing installed. The cost is
# that a bare `pytest` cannot see the integration tier at all, which is how five of
# the s2s shim's drift checks ended up pinned only by tests that nothing ran on the
# way to a commit. scripts/gate.sh runs `-m integration` as a step of its own and
# reports the skip when the venv is missing; tests/unit/test_gate.py fails if a
# marker is deselected here without either a gate step or a written reason.
addopts = "-m 'not integration and not provider_a and not manual'"
