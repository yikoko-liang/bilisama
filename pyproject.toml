[project]
name = "bilisama"
version = "0.1.0"
description = "BiliSama —— B 站直播 AI 伴播"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    # 传输：自己收发帧，不用 openai SDK 的客户端（见计划 §3.1）
    "websockets>=13.0",
    # 只用它的 types.realtime 给正式版方言做收发校验
    "openai>=2.28",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "aiohttp>=3.13",
    "brotli>=1.1",
    "pure-protobuf~=3.1.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=1.26",
    "pysbd>=0.3.4",
]

[project.optional-dependencies]
# 本地 TTS 兜底。云端 Qwen3-TTS 走 HTTP/WS，不需要这个。
mlx = ["mlx-audio>=0.2.0"]

[project.scripts]
bilisama = "bilisama.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bilisama"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",  # 全角标点在中文注释里是正常的
    "RUF002",
    "RUF003",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
# 第三方库没有类型标注的，单独放行
[[tool.mypy.overrides]]
module = ["pysbd.*", "brotli.*", "mlx_audio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: 需要真实的 speech-to-speech 服务，默认不跑",
    "provider_a: 需要真实的托管 Realtime 端点，默认不跑",
    "manual: 一次性探针，手动跑",
]
addopts = "-m 'not integration and not provider_a and not manual'"
