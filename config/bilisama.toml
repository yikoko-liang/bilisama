# BiliSama 配置。这是唯一的真相源，密钥除外（密钥走环境变量）。
#
# 有几类值刻意不在这里：
#   - 冷场阈值、弹幕窗口、打分门槛、冷却、回复长度 —— 由 chattiness 派生，
#     跑 `bilisama config chattiness` 看三档分别是多少
#   - 任何密钥 —— 这里只留一个引用名。今天唯一的后端是环境变量
#     （secrets.py:22-40）：写成 "env:名字" 就读那个环境变量，写成裸名 "abc"
#     先试 BILISAMA_KEY_ABC 再试 abc。系统钥匙串是跟 Electron 壳一起做的规划
#     （计划 §6.5），现在还没有，所以密钥目前没有非终端的入口。
#
# config/s2s/bilisama-s2s.json 是从 [speech.s2s] 渲染出来的产物，不要手改。

config_version = 3                       # v2→v3：礼物分档改用电池、删掉单观众冷却；v1→v2：mia 改名 tofu。旧配置会自动跟上
active_profile = "normal"

[room]
room_id = 0
platform = "bilibili"
credential_ref = "env:BILI_SESSDATA"       # 登录态 cookie 的引用；没设这个环境变量就匿名连（观众全打码）
stream_intro = ""                           # 本场直播在做什么，一两句话；会进提示词，也参与弹幕相关性判断

[speech]
provider = "s2s"                        # s2s | dashscope | volcano | openai_ga

[speech.s2s]
endpoint = "ws://127.0.0.1:8765/v1/realtime"
managed = true                          # false = 你自己在别处跑，这里只填地址
llm_base_url = "http://127.0.0.1:9010/v1"
llm_model = "our-s2t-v1"
patches = ["text_modality", "raw_instructions"]
server_tts = "kokoro"                   # speech-to-speech 自带的引擎（零补丁模式我们用 qwen3）；产品路径纯文本时只是占位
server_tts_speaker = "vivian"           # 服务端 TTS 音色（零补丁模式才出声）；不固定就每句换嗓子

# 判停三件套。字段名跟上游 vad_arguments.py 逐字对齐，CI 有一条门禁对账。
# smart_turn_max_wait_ms 上游默认 2000，我们压到 1200：延迟方差全部来自这个数。
[speech.s2s.turn]
thresh = 0.6
sample_rate = 16000
min_silence_ms = 64
min_speech_ms = 384
min_speech_continuation_ms = 192
speech_pad_ms = 500
audio_enhancement = false
speculative_reopen_ms = 800
unanswered_reopen_ms = 7000
short_segment_merge_ms = 0
smart_turn = true
smart_turn_threshold = 0.5
smart_turn_max_wait_ms = 1200
smart_turn_incomplete_delay_ms = 400
smart_turn_cpu_count = 2

[speech.dashscope]
endpoint = ""
model = ""
api_key_ref = "dashscope"
# 留空的话服务端给 longanqian，实测基频 343Hz，比常见成年女声（180~260Hz）高一截，
# 听着发尖。这里挑的 longanlingxin 是 242Hz。想换随时用 dev-talk 的 --voice 试听，
# 名字写错服务端会把可用清单报回来。
voice = "longanlingxin"

# 火山引擎端到端语音（豆包 S2S）。地址留空就用内置的公网地址，一般不用改。
# 凭据一个就够：控制台 > API Key 管理里拿的那个 API Key。
# 老账号没有 API Key 的话，改填 app_id_ref ＋ access_key_ref 那一对。
[speech.volcano]
endpoint = ""
api_key_ref = "volcano_api_key"
# 1.2.1.1 = O2.0，人设走一段文字描述，配官方音色；
# 2.2.0.0 = SC2.0，人设走角色档案，配克隆音色。换版本要跟着换音色。
model = "1.2.1.1"
# 必须填。留空不是「用个默认嗓子」——服务端那个默认音色自带它自己的角色，会盖过人设，
# 问她是谁她答「豆包」（2026-08-28 真端点复现）。官方四个音色见 docs/runbook.md。
speaker = "zh_female_vv_jupiter_bigtts"
end_smooth_window_ms = 1500             # 停多久算一句说完了。这条路上唯一的判停旋钮

[speech.side]                           # 主动话题、记忆蒸馏、事实抽取都用它，挑便宜的
base_url = ""
model = ""
api_key_ref = "side"

# 我们自己的可插拔 TTS 链路（阶段 4 交付），只在语音后端不自带音频时生效。
# 主力规划是 IndexTTS（授权和 GPU 到位即切，见计划 §4.8）；qwen3_cloud 只是当前能跑的默认。
[custom_tts]
engine = "qwen3_cloud"
voice = ""
speed = 1.0
api_key_ref = "tts"

[audio]
input_device = "auto"
output_device = "auto"
# direct = 她的声音直接从桌宠壳出扬声器，回声消除才盖得住。virtual（走虚拟声卡给 OBS）
# 是 2026-08-24 之前的答案，那时没有回声消除；现在它反而是唯一会把消除绕开的路。
# 注意这两个字段目前运行期没有读者，真正决定声音去哪儿的是面板「声音」那一节。
output_route = "direct"
echo_guard = "duck"                     # 主播一开口先把 AI 音量压下去
input_enabled = true                    # 语音输入开关；每次启动恢复 true，面板改动只管本场
output_enabled = true                   # 语音播报开关；同上
noise_sensitivity = 50                  # 0 更抗噪，100 更容易听见小声说话；本地门限，改了立即生效

[safety]
wordlist_path = "auto"
allowlist_path = "auto"
on_hit = "drop_sentence"

[interaction]
chattiness = "medium"                   # 说话频率的相对档位；实际节奏跟着房间活跃度动态走
reply_length = "low"                    # 每句说多长，独立于说话频率；low 一句短话
sc_protect_ms = 4000                    # 旧版兼容字段；主播现在始终可打断，付费事件靠重排队防丢
gift_battery_high = 1000                # 高额礼物门槛，单位电池（观众礼物面板上的数，1 电池 = 0.1 元）
gift_battery_medium = 100               # 中额礼物门槛，同上；不得高于高额门槛
burst_uniques = 5                       # 以下三项仅兼容旧配置；动态进房合并不再读取
burst_window_s = 45
burst_cooldown_s = 90

# 事件一律入库（记忆、字幕、事件流照常），这里只管说不说
[interaction.speak]
danmaku = true
gift = true
super_chat = true
guard_buy = true
vip_enter = true
entry = true                            # 普通进房按房间活跃度短窗口合并欢迎；繁忙房间自动闭嘴
follow = false
like = false
share = false
proactive = true
background_result = false               # MVP 默认关

[interaction.entry_welcome]             # 进房欢迎按身份分组开关；speak 那边是总闸，这里是分闸
ordinary = true                         # 普通观众（合并欢迎）
naval = true                            # 现役舰队用户（按名欢迎）
ranking = true                          # 本房 5 级以上粉丝牌（按名欢迎）

[interaction.proactive]                 # 主动话题（L1）。开口时机由冷场阈值（话痨度派生）决定
max_per_hour = 12
wake_interval_s = 30                    # 后台思考节奏，不是开口节奏

[memory]
db_path = "auto"
distill_every_n_events = 40             # 按事件计数触发，不按定时器
retain_event_days = 7
write_batch_ms = 0                      # 0=来一条落一条；事件洪峰的大房间再调大（计划 §16.8 第 26 条）
clock_granularity_min = 5               # 推给模型的时间按几分钟取整；粒度越粗，安静时的上下文推送越少

[persona]
id = "tofu"
data_dir = "auto"                       # auto = 用户数据目录/personas/<id>，四个人设文件的活副本在这
streamer_name = "主播"                  # AI 怎么称呼你。填真名它就会叫你名字，比一口一个「主播」亲切
display_name = "豆腐"                     # 它自称什么。也会作为火山的 bot_name 发过去——
                                        # 那边留空的话名字来自服务端默认（豆包），人设里写的名字压不过它

# 生长层三态：off 不长 | collect 只攒进文件、不进提示词 | on 攒并注入（§4.6）。
# 默认全关。先 collect 看几场、翻文件放心了再 on；voice 影响说话风格，建议最后开。
[persona.growth]
relationship = "off"
voice = "off"

# renderer 三选一：tofu 内置像素机器人「豆腐」（零素材）| sprite 精灵图皮肤包 | live2d 待接入（阶段 5）。
# model_id 跟着 renderer 解释：tofu 不用填；sprite 填皮肤包目录名；live2d 填模型目录名。
# 出厂默认 tofu：零素材、无版权包袱，跟代码层的默认一致。想用皮肤包就把 renderer 改成
# sprite、model_id 填目录名（内部分支带了 kirby，约束见 src/bilisama/ui/web/skins/kirby/README.md）；
# 只试一次不用改这里，跑 dev-talk 时加 --skin <名字>。皮肤缺失或损坏会自动退回豆腐。
[avatar]
renderer = "tofu"
model_id = ""
expression_source = "tag"               # 只在我们自己做 TTS 时安全

[runtime]
ui_port = 0
log_level = "info"
log_viewer_content = false              # 弹幕正文是观众的话，默认不落盘
